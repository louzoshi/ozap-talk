name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SopaTalk.slnx

      - name: Verify formatting
        run: dotnet format SopaTalk.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SopaTalk.slnx --configuration Release --no-restore

      # No fixed LogFileName: each test project must produce its own .trx,
      # otherwise they overwrite one another and only the last one survives.
      - name: Test
        run: >
          dotnet test SopaTalk.slnx --configuration Release --no-build
          --logger trx --results-directory TestResults

      # Advisories do not fail the build (see WarningsNotAsErrors in
      # Directory.Build.props); this step keeps them visible in the run log.
      - name: List vulnerable packages
        if: always()
        run: dotnet list SopaTalk.slnx package --vulnerable --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this type-checks too.
      - name: Build
        run: npm run build
